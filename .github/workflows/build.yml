name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_file: Aegis-windows.zip
          - os: macos-latest
            artifact_file: Aegis-macos.zip
          - os: ubuntu-latest
            artifact_file: Aegis-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyinstaller pillow

      - name: Build executable
        run: pyinstaller aegis.spec --noconfirm

      - name: Assemble release bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item dist/Aegis.exe bundle/
          Copy-Item index.html bundle/
          Copy-Item -Recurse vendor bundle/vendor
          Compress-Archive -Path bundle/* -DestinationPath Aegis-windows.zip

      - name: Assemble release bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bundle
          cp -r dist/Aegis.app bundle/
          cp index.html bundle/
          cp -r vendor bundle/vendor
          (cd bundle && zip -r -y ../Aegis-macos.zip .)

      - name: Assemble release bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p bundle/icon
          cp dist/Aegis bundle/
          chmod +x bundle/Aegis
          cp index.html bundle/
          cp -r vendor bundle/vendor
          cp icon/aegis_256.png bundle/icon/
          cp linux/aegis.desktop bundle/
          tar -czf Aegis-linux.tar.gz -C bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_file }}
          path: ${{ matrix.artifact_file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} out/ \;
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
