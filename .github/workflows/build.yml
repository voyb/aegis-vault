name: Build executables

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_file: Aegis-windows.zip
          - os: macos-latest
            artifact_file: Aegis-macos.zip
          - os: ubuntu-latest
            artifact_file: Aegis-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyinstaller==6.22.3 pillow==12.3.0

      - name: Build executable
        run: pyinstaller aegis.spec --noconfirm

      - name: Assemble release bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item dist/Aegis.exe bundle/
          Copy-Item index.html bundle/
          Copy-Item SHA256SUMS bundle/
          Copy-Item -Recurse vendor bundle/vendor
          Compress-Archive -Path bundle/* -DestinationPath Aegis-windows.zip

      - name: Assemble release bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bundle
          cp -r dist/Aegis.app bundle/
          cp index.html bundle/
          cp SHA256SUMS bundle/
          cp -r vendor bundle/vendor
          (cd bundle && zip -r -y ../Aegis-macos.zip .)

      - name: Assemble release bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p bundle/icon
          cp dist/Aegis bundle/
          chmod +x bundle/Aegis
          cp index.html bundle/
          cp SHA256SUMS bundle/
          cp -r vendor bundle/vendor
          cp icon/aegis_256.png bundle/icon/
          cp linux/aegis.desktop bundle/
          tar -czf Aegis-linux.tar.gz -C bundle .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_file }}
          path: ${{ matrix.artifact_file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4  (needed: tools/release.py lives in the repo)

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} out/ \;
          ls -la out

      - name: Checksums for the installers
        run: |
          cd out
          sha256sum Aegis-windows.zip Aegis-macos.zip Aegis-linux.tar.gz > Aegis-SHA256SUMS.txt
          cat Aegis-SHA256SUMS.txt

      # The release is signed OFFLINE by the maintainer (SIGNING.md). CI never holds the private key: it only builds the
      # canonical manifest for each asset (version = tag, sequence = run number: strictly increasing) and opens a DRAFT.
      # The maintainer downloads the manifests, signs them on an offline machine, uploads <asset>.manifest.sig, then publishes.
      - name: Build unsigned manifests (the signature is added offline)
        env:
          PUBKEY: ${{ vars.AEGIS_RELEASE_PUBKEY }}
          # minutes since the epoch: strictly increasing, cannot reset if the workflow is ever recreated (run_number can)
          SEQ_MODE: epoch-minutes
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$PUBKEY" ]; then echo "::warning::repository variable AEGIS_RELEASE_PUBKEY is not set: no manifests built (UNSIGNED BUILD)"; exit 0; fi
          cd out
          for a in Aegis-windows.zip Aegis-macos.zip Aegis-linux.tar.gz; do
            d="$(mktemp -d)"
            case "$a" in *.zip) unzip -q "$a" -d "$d" ;; *) tar -xzf "$a" -C "$d" ;; esac
            python3 -I ../tools/release.py manifest "$d" --version "${TAG#v}" --sequence "$(( $(date -u +%s) / 60 ))" --pubkey "$PUBKEY" -o "$a.manifest"
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          generate_release_notes: true
          draft: true   # never auto-publish: the maintainer signs the manifests offline first (SIGNING.md)
